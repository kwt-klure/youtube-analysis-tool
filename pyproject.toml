[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-analysis-tool"
version = "1.0.8"
description = "Hybrid local-first YouTube analysis tooling for transcripts and keyframes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
youtube = [
  "openai",
  "opencv-python",
  "pytesseract",
  "yt-dlp",
]
mlx-whisper = [
  "mlx-whisper>=0.4.3,<0.5",
]

[project.scripts]
youtube-analyze = "youtube_analysis_tool.pipeline:main"
youtube-batch = "youtube_analysis_tool.batch:main"
youtube-library = "youtube_analysis_tool.library:main"
youtube-contact-sheet = "youtube_analysis_tool.contact_sheet:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
